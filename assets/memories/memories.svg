<svg fill="none" viewBox="0 0 850 480" width="850" height="480" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="carousel-container">
      <style>

    .carousel-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #0d1117;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: autoSlide 24.5s infinite ease-in-out;
      border-radius: 12px;
    }

    .slide:nth-child(1) {
      animation-delay: 0.0s;
    }
  
    .slide:nth-child(2) {
      animation-delay: 3.5s;
    }
  
    .slide:nth-child(3) {
      animation-delay: 7.0s;
    }
  
    .slide:nth-child(4) {
      animation-delay: 10.5s;
    }
  
    .slide:nth-child(5) {
      animation-delay: 14.0s;
    }
  
    .slide:nth-child(6) {
      animation-delay: 17.5s;
    }
  
    .slide:nth-child(7) {
      animation-delay: 21.0s;
    }
  
    @keyframes autoSlide {
      0% { opacity: 0; transform: scale(1.02); }
      3% { opacity: 1; transform: scale(1); }
      11.29% { opacity: 1; transform: scale(1); }
      14.29% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 0; }
    }

      </style>
      <div style="position:relative; width:100%; height:100%;">
        <img class="slide" src="https://raw.githubusercontent.com/dipanr705-12/dipanr705-12/main/assets/memories/111.jpeg" alt="Project Memory" />
        <img class="slide" src="https://raw.githubusercontent.com/dipanr705-12/dipanr705-12/main/assets/memories/112.jpeg" alt="Project Memory" />
        <img class="slide" src="https://raw.githubusercontent.com/dipanr705-12/dipanr705-12/main/assets/memories/113.jpeg" alt="Project Memory" />
        <img class="slide" src="https://raw.githubusercontent.com/dipanr705-12/dipanr705-12/main/assets/memories/114.jpeg" alt="Project Memory" />
        <img class="slide" src="https://raw.githubusercontent.com/dipanr705-12/dipanr705-12/main/assets/memories/115.jpeg" alt="Project Memory" />
        <img class="slide" src="https://raw.githubusercontent.com/dipanr705-12/dipanr705-12/main/assets/memories/smart-bot.jpeg" alt="Project Memory" />
        <img class="slide" src="https://raw.githubusercontent.com/dipanr705-12/dipanr705-12/main/assets/memories/zyro.jpeg" alt="Project Memory" />
      </div>
    </div>
  </foreignObject>
</svg>